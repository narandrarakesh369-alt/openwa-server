{
  "services": [
    {
      "type": "web",
      "name": "openwa-server",
      "runtime": "node",
      "buildCommand": "npm ci --omit=dev --ignore-scripts",
      "startCommand": "node dist/main.js",
      "envVars": [
        { "key": "PORT", "value": "2785" },
        { "key": "NODE_ENV", "value": "development" },
        { "key": "NODE_VERSION", "value": "22.16.0" },
        { "key": "DATABASE_TYPE", "value": "sqlite" },
        { "key": "DATABASE_NAME", "value": "./data/openwa.sqlite" },
        { "key": "DATABASE_SYNCHRONIZE", "value": "true" },
        { "key": "ENGINE_TYPE", "value": "baileys" },
        { "key": "SESSION_DATA_PATH", "value": "./data/sessions" },
        { "key": "STORAGE_TYPE", "value": "local" },
        { "key": "STORAGE_LOCAL_PATH", "value": "./data/media" },
        { "key": "REDIS_ENABLED", "value": "false" },
        { "key": "QUEUE_ENABLED", "value": "false" },
        { "key": "CACHE_ENABLED", "value": "false" },
        { "key": "ALLOW_DEV_API_KEY", "value": "true" },
        { "key": "API_MASTER_KEY", "value": "owa_k1_322c97c576644741ef2f38ffef81d63d969ceebaf9a4336ede757b2f0a165116" },
        { "key": "AUTO_START_SESSIONS", "value": "false" }
      ]
    }
  ]
}
